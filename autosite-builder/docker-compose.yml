services:
  db:
    image: postgres:16-alpine
    container_name: autosite-db
    environment:
      POSTGRES_USER: autosite
      POSTGRES_PASSWORD: autosite
      POSTGRES_DB: autosite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autosite"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
