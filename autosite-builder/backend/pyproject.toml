[project]
name = "autosite-builder-backend"
version = "0.2.0"
description = "Automated Arabic local-business website generator - backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# نُبقي typing.Dict/Optional لأنها مقروءة ومتسقة في كل الوحدات
ignore = ["UP006", "UP035", "UP045"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
